<a class="course-card" href="{{ c.base }}">
  <div class="course-card-top">
    <span class="tag">{{ c.code }}</span>
    <span class="tag soft">{{ c.language }}</span>
  </div>
  <h3>{{ c.title }}</h3>
  <p class="course-tagline">{{ c.tagline }}</p>
  <p>{{ c.summary }}</p>
  <ul class="stats">
    {% for s in c.stats %}<li><strong>{{ s.value }}</strong> {{ s.label }}</li>{% endfor %}
  </ul>
  <span class="card-link">Open course →</span>
</a>
